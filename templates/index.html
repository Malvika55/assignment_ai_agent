<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aster & Row Support Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 24px; }
      .chat-box { height: 60vh; overflow:auto; background:#fff; padding:12px; border-radius:6px; border:1px solid #e6e6e6 }
      .message.user { text-align: right }
      .message.assistant { text-align: left }
      .source-badge { margin-right:6px }
      pre { background:#f7f7f7; padding:12px; overflow:auto }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row mb-3">
        <div class="col-8">
          <h1 class="h4">Aster & Row — Support Agent</h1>
          <p class="text-muted">Interactive demo: ask policy questions or include an order ID (e.g. ORD-1007).</p>
        </div>
        <div class="col-4 text-end">
          <button id="clearBtn" class="btn btn-sm btn-outline-secondary">Clear conversation</button>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8">
          <div id="chat" class="chat-box mb-3">
            {% for turn in history %}
              <div class="message {{ 'user' if turn.role == 'user' else 'assistant' }} mb-2">
                <div class="badge bg-{{ 'primary' if turn.role=='user' else 'secondary' }} source-badge">{{ 'You' if turn.role=='user' else 'Agent' }}</div>
                <div>{{ turn.content }}</div>
              </div>
            {% endfor %}
          </div>

          <div class="input-group mb-3">
            <input id="messageInput" type="text" class="form-control" placeholder="Type your message..." aria-label="Message">
            <button id="sendBtn" class="btn btn-primary">Send</button>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">Last Response</h5>
              <div id="lastAnswer" class="mb-2">—</div>
              <div id="lastSources" class="text-muted small">Sources: —</div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h6 class="card-title">Debug</h6>
              <button id="showDebug" class="btn btn-sm btn-outline-secondary mb-2">Show debug log</button>
              <pre id="debugLog" style="display:none; max-height:40vh; overflow:auto">(none)</pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      async function sendMessage(text){
        if(!text) return;
        const res = await fetch('/api/query', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message: text})
        });
        if(!res.ok){ console.error(await res.text()); return; }
        const data = await res.json();

        // append to chat
        const chat = document.getElementById('chat');
        const userDiv = document.createElement('div'); userDiv.className='message user mb-2';
        userDiv.innerHTML = `<div class="badge bg-primary source-badge">You</div><div>${text}</div>`;
        chat.appendChild(userDiv);

        const botDiv = document.createElement('div'); botDiv.className='message assistant mb-2';
        botDiv.innerHTML = `<div class="badge bg-secondary source-badge">Agent</div><div>${data.answer || ''}</div>`;
        chat.appendChild(botDiv);
        chat.scrollTop = chat.scrollHeight;

        document.getElementById('lastAnswer').innerText = data.answer || '—';
        document.getElementById('lastSources').innerText = 'Sources: ' + ((data.sources || []).join(', ') || '—');
        document.getElementById('debugLog').innerText = data.debug_log || '(none)';
        document.getElementById('debugLog').style.display='none';
      }

      document.getElementById('sendBtn').addEventListener('click', ()=>{
        const input = document.getElementById('messageInput');
        sendMessage(input.value);
        input.value='';
      });
      document.getElementById('messageInput').addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('sendBtn').click(); }});

      document.getElementById('showDebug').addEventListener('click', ()=>{
        const dbg = document.getElementById('debugLog'); dbg.style.display = dbg.style.display === 'none' ? 'block' : 'none';
      });

      document.getElementById('clearBtn').addEventListener('click', async ()=>{
        await fetch('/api/clear', {method:'POST'});
        location.reload();
      });
    </script>
  </body>
</html>
